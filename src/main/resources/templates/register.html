<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Qeydiyyat - Melisa Aptek</title>
</head>
<body>
<div layout:fragment="content">
    <div class="site-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="p-5 bg-white border">
                        <h2 class="h3 mb-4 text-black text-center">Yeni Hesab</h2>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="form-group row">
                            <div class="col-md-6">
                                <label class="text-black">Ad</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="text-black">Soyad</label>
                                <input type="text" th:field="*{surname}" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-12">
                                <label class="text-black">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-12">
                                <label class="text-black">Şifrə</label>
                                <input type="password" th:field="*{password}" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block">Qeydiyyatı Tamamla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
