<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Daxil Ol - Melisa Aptek</title>
</head>
<body>
<div layout:fragment="content">
    <div class="site-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form th:action="@{/login}" method="post" class="p-5 bg-white border">
                        <h2 class="h3 mb-4 text-black text-center">Daxil Ol</h2>
                        <div th:if="${param.error}" class="alert alert-danger">Email və ya şifrə yanlışdır!</div>
                        <div th:if="${param.blocked}" class="alert alert-warning">Hesabınız bloklanmışdır!</div>
                        <div th:if="${param.verified}" class="alert alert-success">Hesabınız təsdiqləndi! İndi daxil ola bilərsiniz.</div>

                        <div class="form-group row">
                            <div class="col-md-12">
                                <label for="username" class="text-black">Email <span class="text-danger">*</span></label>
                                <input type="email" name="username" class="form-control" id="username" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-md-12">
                                <label for="password" class="text-black">Şifrə <span class="text-danger">*</span></label>
                                <input type="password" name="password" class="form-control" id="password" required>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-lg-12">
                                <button type="submit" class="btn btn-primary btn-lg btn-block">Daxil Ol</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
